[project]
name = "camtrap-campo"
version = "0.1.0"
description = "Dados de armadilhas fotográficas do cartão SD à análise, 100% local (Windows)."
readme = "README.md"
authors = [
    { name = "ygorlima55", email = "168221914+ygorlima55@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "astral>=3.2",
    "fastapi>=0.162.0",
    "jinja2>=3.1.6",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "pillow>=13.0.0",
    "pyexiftool>=0.5.6",
    "pytesseract>=0.3.13",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
camtrap-campo = "camtrap_campo:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
# O programa é para Windows: resolver só para Windows evita conflitos de combinações que nunca usamos
# (ex.: speciesnet exige numpy<2 no Mac Intel, e ml-dtypes 0.5 exige numpy>=2.1 no Python 3.13).
environments = ["sys_platform == 'win32'"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
# IA (opcional, ~1 GB): SpeciesNet do Google, que inclui o MegaDetector v5a. Instalar com instalar_ia.bat.
# torch e torchvision precisam ser o par compilado junto: torchvision 0.29.0 exige torch==2.14.0
# (com torch 2.15 ou torchvision 0.29.2 aparece "operator torchvision::nms does not exist" no Windows).
# onnx 1.19 usa ml_dtypes.float4_e2m1fn (existe a partir do ml-dtypes 0.5).
ia = ["speciesnet>=5.0.6", "torch==2.14.0", "torchvision==0.29.0", "ml-dtypes>=0.5.1"]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/camtrap_campo/web/*.py" = ["B008"]  # Form(...)/File(...) como padrão é o idioma do FastAPI

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short -p no:warnings"
